<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Áp giao diện tối trước khi render để tránh nháng (FOUC).
      (function () {
        try {
          var t = localStorage.getItem('chou:theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Chou Dress — Cho thuê váy thiết kế</title>
    <meta name="description" content="Chou Dress — atelier cho thuê váy cưới, dạ hội và áo dài. Đặt lịch thử như một buổi hẹn couture." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
